
name: Analyze Xbox Executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Inspect XBE header and sections
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find . -type f -iname 'default.xbe' -print -quit)"
          if [ -z "$FILE" ]; then
            echo "ERROR: default.xbe not found"
            exit 1
          fi
          python3 - "$FILE" <<'PY'
          import sys, struct, hashlib
          from pathlib import Path

          p = Path(sys.argv[1])
          d = p.read_bytes()

          def u32(off):
              if off + 4 > len(d):
                  raise ValueError(f"Header field outside file: {off:#x}")
              return struct.unpack_from("<I", d, off)[0]

          print("File:", p.name)
          print("Size:", len(d), "bytes")
          print("SHA-256:", hashlib.sha256(d).hexdigest())

          if len(d) < 0x124 or d[:4] != b"XBEH":
              raise SystemExit("ERROR: Invalid or incomplete XBE header")

          base = u32(0x104)
          headers_size = u32(0x108)
          image_size = u32(0x10C)
          cert_va = u32(0x118)
          section_count = u32(0x11C)
          section_table_va = u32(0x120)
          entry_va = u32(0x128)

          print("\n--- XBE HEADER ---")
          print(f"Base address:       0x{base:08X}")
          print(f"Header size:        0x{headers_size:X}")
          print(f"Image size:         0x{image_size:X}")
          print(f"Certificate VA:     0x{cert_va:08X}")
          print(f"Entry point VA:     0x{entry_va:08X}")
          print(f"Section count:      {section_count}")
          print(f"Section table VA:   0x{section_table_va:08X}")

          table_off = section_table_va - base
          entry_off = entry_va - base

          print(f"Entry file offset:  0x{entry_off:X}")
          if entry_off >= len(d):
              print("WARNING: Entry address does not map inside file directly.")

          if section_count > 4096:
              raise SystemExit("ERROR: Implausible section count")
          if table_off < 0 or table_off + section_count * 0x38 > len(d):
              raise SystemExit("ERROR: Section table outside file")

          print("\n--- SECTIONS ---")
          for i in range(section_count):
              o = table_off + i * 0x38
              flags, va, vsize, raw, rsize, name_va = struct.unpack_from(
                  "<6I", d, o
              )
              print(
                  f"[{i}] flags=0x{flags:08X} "
                  f"VA=0x{va:08X} virtual_size=0x{vsize:X} "
                  f"raw_offset=0x{raw:X} raw_size=0x{rsize:X} "
                  f"name_VA=0x{name_va:08X}"
              )
          PY
          
